# Пример конфигурации подключения VK TURN (Windows Desktop)
# Скопируйте этот файл как config.ini и заполните своими данными

# Адрес и порт вашего сервера (VPS)
PEER=1.2.3.4:56000

# Пароль подключения (из него выводится HKDF-SHA256 ключ шифрования)
PASSWORD=your_secure_password_here

# Ссылка-приглашение или хеш VK-звонка (можно несколько через запятую)
VK_HASH=https://vk.com/call/join/your_call_hash_here

# Количество параллельных воркеров (по умолчанию 18-27)
WORKERS=18
